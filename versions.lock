# Reproducibility pins for the v1 public XDNA1/XDNA2 workflows.
# This exact lock and acceptance contract were hardware-revalidated on Strix
# Point XDNA2. Phoenix XDNA1 has earlier real-hardware evidence with the same
# IREE source commit but a then-current Peano; reconfirmation of this exact
# Peano 22 lock on XDNA1 is explicitly requested.
#
# This is a shell assignment file consumed by scripts/build.sh and
# scripts/setup-mlir-aie.sh. Keep it data-only: NAME=value, with no commands.
# Update a pin only after the complete build and hardware checks pass together.

